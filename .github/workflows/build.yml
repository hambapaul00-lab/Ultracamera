name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Extraction du code source
      uses: actions/checkout@v4

    - name: Configuration de Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configuration du SDK Android
      uses: android-actions/setup-android@v3

    - name: Téléchargement automatique du SDK OpenCV C++
      run: |
        mkdir -p app/src/main/cpp/opencv
        curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
        unzip -q opencv.zip
        cp -r OpenCV-android-sdk/sdk app/src/main/cpp/opencv/

    - name: Génération du Gradle Wrapper
      run: gradle wrapper

    - name: Compilation de l'APK Android (NDK + C++)
      run: ./gradlew assembleDebug --stacktrace

    - name: Exportation du fichier APK final
      uses: actions/upload-artifact@v4
      with:
        name: UltraCamera-S20Ultra-APK
        path: app/build/outputs/apk/debug/app-debug.apk
